<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05161A" />
  <title>EXTRACT — Sin conexión</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background-color: #05161A;
      color: #E8F4F6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background-color: #072E33;
      border: 1px solid rgba(109, 165, 192, 0.24);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
    }
    p {
      margin: 0;
      font-size: 0.92rem;
      color: #6DA5C0;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      border: none;
      background-color: #0F969C;
      color: #05161A;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sin conexión disponible</h1>
    <p>No se pudo cargar este recurso porque no hay conexión y aún no estaba guardado en la caché local de EXTRACT.</p>
    <a class="btn" href="../index.html">Volver a EXTRACT</a>
  </main>
</body>
</html>
